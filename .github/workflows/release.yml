name: release

# Builds the workbench tarball on a tag and attaches it to the GitHub Release.
# No secrets required: the release asset is published with the workflow's own
# GITHUB_TOKEN. Install from the asset URL:
#
#   dsh plugin --profile <profile> add \
#     https://github.com/sanmuforest/dsh-better-sidebar-sanmu/releases/download/v0.1.0/dsh-better-sidebar-sanmu-0.1.0.tgz
#
# A registry publish is deliberately NOT part of this workflow: it needs a
# registry + token decision (npm public / GitHub Packages / self-hosted).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The lockfile was produced with --legacy-peer-deps (the DSH peer graph is
      # intentionally loose), so the install uses the same flag.
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: node node_modules/typescript/bin/tsc -p tsconfig.build.json
      - run: node node_modules/tsdown/dist/run.mjs
      - run: npm pack --ignore-scripts
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dsh-better-sidebar-sanmu-*.tgz
          generate_release_notes: true
