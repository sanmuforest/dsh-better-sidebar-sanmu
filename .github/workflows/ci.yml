name: ci

# Just the gates that matter for this fork: the package must type-check and
# bundle. The upstream test/e2e lanes are not wired in (they need Playwright and
# a live DSH host); run them locally when touching the reused upstream modules.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: node node_modules/typescript/bin/tsc -p tsconfig.build.json
      - run: node node_modules/tsdown/dist/run.mjs
