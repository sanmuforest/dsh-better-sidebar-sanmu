name: ci

# The gates this fork relies on: the package must type-check, bundle, and keep
# the inherited vitest suite green (that suite is the regression net for every
# reused upstream module). The upstream e2e lanes need Playwright plus a live
# DSH host and stay local: `pnpm build && pnpm pack && pnpm test:mount`.

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: node node_modules/typescript/bin/tsc -p tsconfig.build.json
      - run: node node_modules/tsdown/dist/run.mjs
      # After the bundle steps: `tests/chunk-artifact.spec.ts` inspects lib/.
      - run: npm test
